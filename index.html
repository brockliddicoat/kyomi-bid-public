<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Kyomi Mouse Design Bid</title>
<link data-keep="" rel="preconnect" href="https://fonts.googleapis.com">
<link data-keep="" rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link data-keep="" href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&amp;display=swap" rel="stylesheet">
<style id="bid-css">
/* Layout: one straight column, the way a printed proposal reads. Packages sit side by side as columns
   (stacked on a phone). One full-width blue block holds everything the client can change:
   blue means "add-on" and nothing else. Flat filled surfaces, no outlined boxes.
   Every row opens where it is, to what it covers, its cost split and its options: detail on request,
   never all at once. Type: one family at its normal width. Headings are set a step heavier than the text and tracked
   slightly tight; nothing is stretched, oversized or extra-bold. Size and space carry the hierarchy. */
:root {
  --paper: #F5F5F3;
  --card: #FFFFFF;
  --well: #ECECE8;
  --ink: #101010;
  --soft: #5E5E59;
  --blue: #2447E8;
  --on-blue: #FFFFFF;
  --wash: #E6EBFF;
  --amber: #F2B632;
  --risk-hi: #CF4317;
  --risk-mid: #B97F00;
  --risk-lo: #25813F;
  /* One color for each package, on marks only: bars, dots and swatches. Text never wears them.
     The three weight packages take three of the same colors, and each says what its label is printed in. */
  --p-consult: #14B8A6; --p-design: #0369A1; --p-tested: #60A5FA; --p-production: #4338CA; --p-all: #A855F7;
  --w-30: #38BDF8; --w-34: #0284C7; --w-38: #075985;   /* weight targets: never purple, lighter as the target is lighter */
  --w-30-t: #101010; --w-34-t: #FFFFFF; --w-38-t: #FFFFFF;
  --display: "Archivo", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --body: "Archivo", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --head: 620;   /* weight of headings */
  --fig: 650;    /* weight of prices and other figures that lead a block */
  --r: 8px;
  --r2: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E0E0E; --card: #1A1A1A; --well: #2B2B2B; --ink: #F3F3F0; --soft: #A9A9A3;
    --blue: #4966F2; --on-blue: #FFFFFF; --wash: #1C2760; --amber: #F2B632;
    --risk-hi: #FF8257; --risk-mid: #F2B632; --risk-lo: #62C785;
    --p-consult: #0DA995; --p-design: #0074A4; --p-tested: #6C94DF; --p-production: #6143C3; --p-all: #BB68E2;
    --w-30: #7DD3FC; --w-34: #0EA5E9; --w-38: #0369A1;
    --w-30-t: #0E0E0E; --w-34-t: #0E0E0E; --w-38-t: #FFFFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E0E0E; --card: #1A1A1A; --well: #2B2B2B; --ink: #F3F3F0; --soft: #A9A9A3;
  --blue: #4966F2; --on-blue: #FFFFFF; --wash: #1C2760; --amber: #F2B632;
  --risk-hi: #FF8257; --risk-mid: #F2B632; --risk-lo: #62C785;
  --p-consult: #0DA995; --p-design: #0074A4; --p-tested: #6C94DF; --p-production: #6143C3; --p-all: #BB68E2;
  --w-30: #7DD3FC; --w-34: #0EA5E9; --w-38: #0369A1;
  --w-30-t: #0E0E0E; --w-34-t: #0E0E0E; --w-38-t: #FFFFFF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-size: 103.125%; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 1rem;
  line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, h5 { margin: 0; text-wrap: balance; }
b, strong { font-weight: 650; }
h1, h2 { font-family: var(--display); font-weight: var(--head); letter-spacing: -0.018em; }
h3 { font-size: 1.05rem; font-weight: 650; line-height: 1.25; letter-spacing: -0.004em; }
p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
summary { cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1160px; margin-inline: auto; padding-inline: 16px; }
.sec { padding-block: 44px; }
.sec-head { display: grid; gap: 10px; margin-bottom: 20px; max-width: 44rem; }
.sec-head h2 { font-size: clamp(1.38rem, 5.2vw, 1.7rem); line-height: 1.15; }
.sec-head p { color: var(--soft); font-size: 1rem; }

/* ---------- letterhead and cover ---------- */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 16px 10px; min-height: 56px; }
.brand { font-family: var(--display); font-weight: 650; font-size: 1rem; letter-spacing: -0.006em; }
.top nav { display: none; gap: 2px; }
.top nav button { padding: 8px 12px; border-radius: 6px; font-size: .9rem; font-weight: 600; color: var(--soft); }
.top nav button:hover { background: var(--well); color: var(--ink); }
.top-edit { display: inline-flex; align-items: center; gap: 6px; background: var(--blue); color: var(--on-blue); font-weight: 650; font-size: .86rem; padding: 8px 12px; border-radius: 6px; }
.top-edit svg { width: 14px; height: 14px; }
.cover { display: grid; gap: 28px; padding-block: 18px 14px; }
.kind { font-weight: 650; font-size: .95rem; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.kind::before { content: ""; width: 10px; height: 10px; background: var(--blue); border-radius: 2px; }
.cover h1 { font-size: clamp(1.85rem, 7.6vw, 2.7rem); font-weight: 600; letter-spacing: -0.024em; line-height: 1.08; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-top: 22px; }
.facts dt { font-size: .76rem; color: var(--soft); line-height: 1.3; }
.facts dd { font-weight: 650; font-size: .95rem; line-height: 1.3; }
@media (max-width: 719px) { .facts > div:last-child:nth-child(odd) { grid-column: 1 / -1; } }
.letter { margin-top: 22px; display: grid; gap: 10px; max-width: 35rem; }
.letter p { font-size: 1.04rem; line-height: 1.52; }
.sign { font-weight: 650; font-size: 1rem; margin-top: 4px; }
.target { background: var(--card); border-radius: var(--r); padding: 18px 14px 12px; }
.target h2 { font-size: 1.05rem; font-weight: 650; letter-spacing: -0.004em; line-height: 1.25; }
.gfx { display: grid; gap: 8px; margin-top: 12px; }
.gfx figure { background: var(--paper); border-radius: var(--r2); padding: 10px 8px 4px; }
.gfx figcaption { font-size: .78rem; font-weight: 650; padding-left: 6px; }
.axis { display: block; width: 100%; height: auto; }
.axis .base { stroke: var(--ink); stroke-width: 1.4; }
.axis .tick { stroke: var(--soft); stroke-width: 1; }
.axis .tl { fill: var(--soft); font-size: 9px; }
.axis .zone { fill: var(--blue); opacity: .22; }
.axis .lead { stroke: var(--soft); stroke-width: .9; stroke-dasharray: 2 2.5; }
.axis .lead.me { stroke: var(--blue); stroke-width: 1.3; stroke-dasharray: none; }
.axis circle.ref { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
.axis circle.me { fill: var(--blue); }
.axis .rn { fill: var(--soft); font-size: 9.5px; }
.axis .rv { fill: var(--ink); font-size: 10px; font-weight: 650; }
.axis .mn { fill: var(--blue); font-size: 11px; font-weight: 650; }
.axis .zt { font-size: 10px; font-weight: 700; }
.axis .zs { fill: var(--ink); }
.wl { display: grid; gap: 4px; padding: 4px 6px 0; font-size: .78rem; line-height: 1.35; }
.wl li { display: flex; align-items: baseline; gap: 7px; color: var(--soft); }
.wl li b { color: var(--ink); font-weight: 600; white-space: nowrap; }
.wl li.on b { font-weight: 750; }
.wl .pc { align-self: center; margin-right: 0; }
.fc2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-right: 6px; }
.fc2 span + span { font-weight: 500; color: var(--soft); }
.fig-n { font-size: .76rem; color: var(--soft); line-height: 1.4; padding: 5px 6px 6px; }
.key { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 14px 0 8px; font-size: .8rem; color: var(--soft); }
.key > span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--soft); display: inline-block; flex: none; opacity: .5; }
.dot.me { background: var(--ink); opacity: 1; }
.dot.prop { background: none; box-shadow: inset 0 0 0 2.5px var(--ink); opacity: 1; }
.t-in { font-size: .86rem; color: var(--soft); line-height: 1.4; margin-top: 4px; }
.ts { display: grid; gap: 3px; }
.tsg { background: var(--paper); border-radius: var(--r2); }
.tsg > summary { padding: 10px 11px; display: grid; gap: 2px; border-radius: var(--r2); }
.tsg h3 { font-size: .95rem; }
.tsg .gt { grid-template-columns: 1fr auto; }
.tsg .gi { font-size: .84rem; }
.tsb { padding: 0 8px 8px; display: grid; gap: 2px; }
.tsr { background: var(--card); border-radius: 4px; padding: 9px 11px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; align-items: center; }
.tl { grid-column: 1; font-size: .8rem; color: var(--soft); line-height: 1.3; }
.src { grid-column: 2; grid-row: 1; display: inline-flex; gap: 4px; align-items: center; }
.tv { grid-column: 1 / -1; font-weight: 650; font-size: .98rem; line-height: 1.3; }
.tm { grid-column: 1 / -1; font-size: .8rem; color: var(--soft); line-height: 1.4; margin-top: 2px; }
body.edit-text .src { padding: 8px 10px; margin: -6px -8px -6px 0; border-radius: 6px; background: rgba(36, 71, 232, .16); cursor: pointer; min-width: 40px; min-height: 28px; justify-content: center; }

/* ---------- package colors, and the small charts that use them ---------- */
.pc { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; margin-right: 7px; }
.plus { display: inline-block; background: var(--blue); color: var(--on-blue); font-weight: 650; font-size: .68rem; line-height: 1; padding: 4px 7px; border-radius: 4px; margin-left: 7px; vertical-align: 2px; white-space: nowrap; letter-spacing: 0; }
.lgd { display: flex; flex-wrap: wrap; gap: 3px 14px; padding: 6px 4px 0; font-size: .78rem; color: var(--soft); line-height: 1.35; }
.lgd > span { display: inline-flex; align-items: center; }
.lgd > span.on { color: var(--ink); font-weight: 650; }
.lgd .pc { margin-right: 6px; }
.lgd .k { width: 14px; height: 8px; border-radius: 2px; background: var(--ink); margin-right: 6px; flex: none; }
.lgd .k.m { opacity: .58; }
.lgd .k.t { opacity: .3; }
.lgd .k.f, .lgd .k.o { width: 9px; height: 9px; border-radius: 50%; }
.lgd .k.o { background: none; box-shadow: inset 0 0 0 2.5px var(--ink); }
.gfx .lgd { padding: 2px 6px 0; }
.cmp { background: var(--card); border-radius: var(--r); padding: 16px 10px 10px; display: grid; gap: 14px; margin-bottom: 10px; }
.cmp-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 14px; padding: 0 6px; }
.cmp-h p { font-size: .82rem; color: var(--soft); }
.cmp-g { display: grid; gap: 20px; }
.cmp-g.one { margin-top: 20px; }
.fg { display: grid; gap: 2px; min-width: 0; align-content: start; }
.fg figcaption { display: grid; gap: 1px; padding: 0 6px 6px; }
.fg figcaption b { font-size: .95rem; line-height: 1.25; }
.fg figcaption > span { font-size: .8rem; color: var(--soft); line-height: 1.35; }
/* A row of a chart. On a phone the name and the figure share a line and the bar runs under them at full width,
   so a name of any length fits. On a wide screen the three sit side by side. */
.cr { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "n v" "t t"; gap: 5px 10px; align-items: center; width: 100%; padding: 6px; border-radius: 5px; font-size: .82rem; line-height: 1.2; text-align: left; }
.cr.nv { grid-template-areas: "n n" "t t"; }
button.cr:hover, .cr[aria-pressed="true"] { background: var(--paper); }
.cr[aria-pressed="true"] .cn { font-weight: 650; }
.cr.hdr { padding-block: 0; }
.cr.hdr .cn { display: none; }
.cn { grid-area: n; display: inline-flex; align-items: center; min-width: 0; }
.ct { grid-area: t; display: flex; align-items: center; min-width: 0; min-height: 12px; }
.cv { grid-area: v; font-weight: 650; white-space: nowrap; text-align: right; min-width: 2.4rem; }
@media (min-width: 860px) {
  .cr { grid-template-columns: 10rem minmax(0, 1fr) auto; grid-template-areas: "n t v"; gap: 10px; min-height: 34px; padding: 4px 6px; }
  .cr.nv { grid-template-columns: 10rem minmax(0, 1fr); grid-template-areas: "n t"; }
  .cr.hdr { min-height: 0; }
  .cr.hdr .cn { display: inline-flex; }
}
.bar2 { display: flex; gap: 2px; height: 12px; border-radius: 0 4px 4px 0; overflow: hidden; min-width: 4px; }
.bar2 i { display: block; min-width: 2px; }
.bar2 i.m { opacity: .58; }
.bar2 i.t { opacity: .3; }
.sg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; width: 100%; }
.sg i { height: 12px; border-radius: 2px; background: var(--well); font-style: normal; }
.hdr .sg i { background: none; height: auto; font-size: .72rem; color: var(--soft); text-align: center; line-height: 1.2; }
.dots { display: flex; flex-wrap: wrap; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dots i.f { background: currentColor; }
.dots i.o { box-shadow: inset 0 0 0 2.5px currentColor; }
.stg { counter-reset: st; display: flex; flex-wrap: wrap; gap: 3px 14px; padding: 8px 6px 0; font-size: .78rem; color: var(--soft); line-height: 1.35; }
.stg li { counter-increment: st; }
.stg li::before { content: counter(st) "\00a0"; font-weight: 650; color: var(--ink); }
.cmp .lgd { padding: 8px 6px 0; }
.cmp-more > summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 6px; border-radius: 6px; font-size: .92rem; }
.cmp-more > .cmp-g { padding-top: 12px; }
@media (min-width: 860px) {
  .cmp { padding: 20px 16px 14px; }
  .cmp-g { grid-template-columns: 1fr 1fr; gap: 30px; }
  .cmp-g.three { grid-template-columns: repeat(3, 1fr); }
  .cmp-g.one { grid-template-columns: 1fr; margin-top: 30px; }
}

/* ---------- packages: phone ---------- */
.pk-list { display: grid; gap: 6px; }
.pk { border-radius: var(--r); background: var(--card); overflow: hidden; }
.pk-head { display: grid; gap: 4px; width: 100%; padding: 14px 16px; }
.pk-head .hd { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px 12px; }
.pk-head .nm { font-weight: 680; font-size: 1.12rem; letter-spacing: -0.008em; line-height: 1.2; }
/* the price keeps its place on the right whatever the length of the name, with "+ add-ons" under it */
.pk-head .pr { font-weight: var(--fig); font-size: 1rem; line-height: 1.2; white-space: nowrap; display: grid; justify-items: end; gap: 5px; }
.pk-head .pr .plus { margin-left: 0; vertical-align: 0; }
.pk-head .ln { font-size: .9rem; color: var(--soft); }
.pk-head .xt { font-size: .8rem; font-weight: 650; }
.vl { display: block; font-size: .84rem; line-height: 1.4; }
.nw { display: block; font-weight: 650; font-size: .92rem; line-height: 1.3; }
.base-tag { font-weight: 650; font-size: .68rem; background: var(--well); padding: 3px 7px; border-radius: 4px; margin-left: 8px; vertical-align: 3px; letter-spacing: 0; }
.pk[data-on="1"] .pk-head { background: var(--ink); color: var(--paper); }
.pk[data-on="1"] .pk-head .ln { color: inherit; opacity: .78; }
.pk[data-on="1"] .base-tag, .mx-head[data-on="1"] .base-tag { background: rgba(128, 128, 128, .45); background: color-mix(in srgb, var(--paper) 22%, transparent); }
.pk-body { display: none; padding: 12px; }
.pk[data-on="1"] .pk-body { display: grid; gap: 12px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.stat { background: var(--paper); border-radius: var(--r2); padding: 9px 11px; font-size: .78rem; color: var(--soft); }
.stat b { display: block; font-size: 1rem; line-height: 1.2; color: var(--ink); }
/* the price, split: one bar that adds up to the figure in its heading */
.inside { background: var(--paper); border-radius: var(--r2); padding: 10px 11px 11px; display: grid; gap: 8px; }
.in-h { font-size: .86rem; font-weight: 650; color: var(--ink); line-height: 1.25; }
.inside > .sp { height: 8px; color: var(--ink); }
.inside dl { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.inside dl div { display: grid; gap: 1px; }
.inside dt { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--soft); }
.inside dd { font-weight: 650; font-size: .95rem; color: var(--ink); }
.inside .sw { width: 9px; height: 9px; flex: none; color: var(--ink); }
.inside .sw i { flex: 1; }
.in-n { font-size: .78rem; color: var(--soft); line-height: 1.35; }
.pk-hint { font-size: .82rem; color: var(--soft); line-height: 1.4; }
.rows { display: grid; gap: 2px; }
.rw { background: var(--paper); border-radius: 4px; }
.rw-h { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px 10px; align-items: center; width: 100%; padding: 9px 8px 9px 11px; min-height: 46px; border-radius: 4px; }
.rw-l { grid-column: 1; font-size: .9rem; line-height: 1.25; }
.rw-v { grid-column: 2; text-align: right; font-weight: 650; font-size: .9rem; line-height: 1.2; max-width: 10.5rem; }
.rw-v small, .mx-cell small { display: block; font-weight: 500; color: var(--soft); font-size: .75rem; }
.rw-h > .lv { grid-column: 3; }
.rw-h > .chev { grid-column: 4; }
.rw-b { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.rw-n { font-size: .78rem; color: var(--soft); line-height: 1.2; }
.rw.off .rw-l { color: var(--soft); }
/* the bars: one for each step up among a row's options, filled as far as the package goes */
.lv { display: inline-grid; gap: 2px; width: 14px; flex: none; }
.lv i { display: block; height: 4px; border-radius: 1px; background: rgba(128, 128, 128, .34); }
.lv i.f { background: var(--ink); }
.lv i.a { background: var(--blue); }
/* what opens under a row */
.rw-p { padding: 2px 8px 10px; display: grid; gap: 8px; }
.rw-i { display: grid; gap: 8px; min-width: 0; }
.rw-x, .rw-w { font-size: .88rem; line-height: 1.45; padding: 0 3px; }
.rw-x { color: var(--soft); }
.its { display: grid; gap: 3px; }
.it { background: var(--card); border-radius: 6px; padding: 10px 11px; display: grid; gap: 7px; }
.it-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
.it-n { font-weight: 650; font-size: .92rem; line-height: 1.3; }
.it-a { font-weight: 650; font-size: .92rem; white-space: nowrap; text-align: right; line-height: 1.3; }
.it-a small { display: block; font-weight: 500; font-size: .76rem; color: var(--soft); }
/* an item that comes with the package at no charge: its name, then which package it comes with */
.it-h.inc { grid-template-columns: minmax(0, 1fr); gap: 1px; }
.it-h.inc .it-a { text-align: left; white-space: normal; font-size: .86rem; }
.it-h.inc .it-a small { font-size: .8rem; }
.lg-a.inc { white-space: normal; max-width: 9.5rem; text-wrap: balance; font-size: .86rem; line-height: 1.25; }
.sp { display: flex; height: 6px; border-radius: 2px; overflow: hidden; gap: 2px; }
.sp i { display: block; min-width: 3px; background: currentColor; }
.sp i.m { opacity: .45; }
.sp i.t { opacity: .2; }
.it-d { display: grid; gap: 4px; }
.it-d > div { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr) auto; gap: 8px; font-size: .82rem; line-height: 1.4; align-items: baseline; }
.it-d dt { color: var(--soft); }
.it-d .a { font-weight: 650; white-space: nowrap; text-align: right; }
.it-d .y { color: var(--soft); display: block; }
/* what an item's materials are made of: one line each, under the Materials total */
.ml { list-style: none; display: grid; gap: 3px; padding-left: 10px; border-left: 2px solid var(--well); font-size: .8rem; line-height: 1.4; }
.ml li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
.ml .a { white-space: nowrap; text-align: right; color: var(--soft); font-weight: 550; }
.ml .y { color: var(--soft); display: block; }
.ml.flat { border-left: 0; padding-left: 0; font-size: .84rem; gap: 5px; }
.ml.flat .a { color: inherit; font-weight: 650; }
.it-w { font-size: .84rem; line-height: 1.45; color: var(--soft); }
.it-t { display: flex; justify-content: space-between; gap: 12px; padding: 5px 11px 0; font-weight: 650; font-size: .9rem; }
.ic { width: 19px; height: 19px; display: inline-block; vertical-align: -4px; }
.ic-no { color: var(--soft); opacity: .7; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--blue); color: var(--on-blue); font-weight: 650; font-size: .76rem; line-height: 1; padding: 7px 10px 7px 9px; border-radius: 5px; white-space: nowrap; }

.extras { background: var(--ink); color: var(--paper); border-radius: var(--r2); padding: 12px 13px; display: grid; gap: 2px; }

.extras li > span:last-child { opacity: .8; white-space: nowrap; }
.pk-note { font-size: .84rem; color: var(--soft); line-height: 1.45; }
.btn { display: inline-flex; justify-content: center; align-items: center; min-height: 44px; padding: 0 18px; border-radius: var(--r2); background: var(--ink); color: var(--paper); font-weight: 650; }

/* ---------- packages: wide screens, as columns ---------- */

  .mx-corner { align-self: end; padding: 0 4px 12px; font-size: .82rem; color: var(--soft); line-height: 1.4; }
  .mx-lab { padding: 9px 4px 9px 6px; display: grid; gap: 6px; align-content: center; width: 100%; border-radius: 4px; }
  button.mx-lab:hover { background: var(--well); }

  .mx-lab .chev { width: 22px; height: 22px; }
  .mx-cell { background: var(--card); padding: 9px 10px; display: flex; gap: 9px; align-items: center; justify-content: center; text-align: center; font-weight: 650; font-size: .86rem; line-height: 1.25; min-height: 46px; }
  .mx-panel { grid-column: 1 / -1; background: var(--card); border-radius: 4px; padding: 14px; margin-bottom: 6px; }
  .mx-panel .rw-p { padding: 0; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .mx-panel .rw-p > :only-child { grid-column: 1 / -1; max-width: 44rem; }
  .mx-panel .it { background: var(--paper); }
  .mx-cell[data-on="1"], .mx-foot[data-on="1"] { background: var(--well); background: color-mix(in srgb, var(--ink) 9%, var(--card)); }
  .mx-foot { background: var(--card); border-radius: 0 0 var(--r) var(--r); padding: 10px; }
  .mx-foot .extras { height: 100%; align-content: start; }
  .mx-foot .extras li { grid-template-columns: 1fr; gap: 0; font-size: .82rem; }
  .mx-lab.foot { align-content: start; padding-top: 22px; }
}

/* ---------- options: the same blue as the button that announces them ---------- */
.ao { background: var(--blue); color: var(--on-blue); border-radius: 6px; padding: 12px 10px 10px; display: grid; gap: 8px; min-width: 0; }

.ao-i { font-size: .84rem; line-height: 1.4; opacity: .92; padding: 0 2px; }
.ao-g { font-size: .92rem; font-weight: 650; padding: 8px 2px 0; }
.ao :focus-visible { outline-color: var(--on-blue); }
.gt { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; }
.gi { font-size: .88rem; color: var(--soft); line-height: 1.4; padding-right: 36px; }
.chip { background: var(--blue); color: var(--on-blue); font-weight: 650; font-size: .76rem; padding: 6px 8px; border-radius: 5px; line-height: 1; white-space: nowrap; }
.chev { width: 26px; height: 26px; border-radius: 6px; background: var(--well); display: grid; place-items: center; flex: none; }
.chev svg { width: 13px; height: 13px; transition: transform .15s; }
details[open] > summary .chev svg, .rw.open > .rw-h .chev svg, .mx-lab.open .chev svg, .lg.open > .lg-h .chev svg { transform: rotate(45deg); }
.opts { display: grid; gap: 3px; }
.opt { display: grid; grid-template-columns: 18px 1fr; gap: 0 11px; align-items: start; width: 100%; background: var(--card); color: var(--ink); border-radius: var(--r2); padding: 11px 12px; min-height: 48px; }
.opt .rb { width: 18px; height: 18px; border-radius: 50%; background: var(--well); display: grid; place-items: center; margin-top: 2px; }

.opt[aria-checked="true"] .rb { background: var(--paper); }
.opt[aria-checked="true"] .rb::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.opt .bd2 { display: grid; gap: 3px; min-width: 0; }
.opt .tp { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 14px; }

.opt .d { font-weight: 650; font-size: .86rem; line-height: 1.3; white-space: nowrap; }
.opt .s { font-size: .83rem; line-height: 1.4; opacity: .8; }
.opt .mth { white-space: normal; }
.opt .v { font-size: .83rem; line-height: 1.4; font-weight: 550; }
.opt[aria-disabled="true"] { opacity: .55; cursor: default; }
.stepper { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--card); color: var(--ink); border-radius: var(--r2); padding: 8px 8px 8px 12px; }

.stepper .ctl b { font-weight: var(--fig); font-size: 1.12rem; }
.stepper .ctl button { width: 42px; height: 42px; border-radius: var(--r2); background: var(--ink); color: var(--paper); display: grid; place-items: center; font-weight: 600; font-size: 1.25rem; line-height: 1; }
.stepper .ctl button[disabled] { background: var(--well); color: var(--soft); cursor: default; }
.math { font-size: .83rem; color: var(--soft); line-height: 1.45; }
.ao .math { color: inherit; opacity: .9; padding: 0 2px; }
.risk { border-radius: var(--r2); padding: 12px; background: var(--card); color: var(--ink); display: grid; gap: 6px; }
.risk .bar3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.risk .bar3 i { height: 8px; border-radius: 2px; background: var(--well); }
.risk[data-l="1"] .bar3 i:nth-child(-n+1) { background: var(--risk-lo); }
.risk[data-l="2"] .bar3 i:nth-child(-n+2) { background: var(--risk-mid); }
.risk[data-l="3"] .bar3 i { background: var(--risk-hi); }
.risk b { font-size: .96rem; }
.risk[data-l="1"] b { color: var(--risk-lo); }
.risk[data-l="2"] b { color: var(--risk-mid); }
.risk[data-l="3"] b { color: var(--risk-hi); }
.risk p { font-size: .88rem; line-height: 1.4; }
.risk .cap { font-size: .76rem; color: var(--soft); }
.why { display: grid; gap: 3px; }
@media (min-width: 620px) { .why { grid-template-columns: 1fr 1fr; } }
.why > div { background: var(--card); color: var(--ink); border-radius: var(--r2); padding: 12px; font-size: .88rem; line-height: 1.45; }
.why b { display: block; font-size: .96rem; margin-bottom: 2px; }
.why .m { color: var(--soft); font-size: .8rem; display: block; margin-bottom: 6px; }
.after { font-size: .9rem; }
.matrix + .after { margin-top: 14px; }
.reset { font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- price, line by line ---------- */
.pricegrid { display: grid; gap: 10px; }
@media (min-width: 960px) { .pricegrid { grid-template-columns: minmax(0, 1fr) 21.5rem; align-items: start; } .totals { position: sticky; top: 14px; order: 2; } }
.totals { background: var(--ink); color: var(--paper); border-radius: var(--r); padding: 18px 16px; display: grid; gap: 12px; }

.totals .cap { font-size: .84rem; opacity: .8; }
.totals .tb { display: grid; gap: 3px; margin-top: 10px; font-size: .9rem; }
.totals .tb > div { display: flex; justify-content: space-between; gap: 12px; }

.totals dt { display: inline-flex; align-items: center; gap: 7px; }
.totals dd { font-weight: 650; text-align: right; }
.totals .sw { width: 10px; height: 10px; flex: none; }
.totals .sw i { flex: 1; }
.totals .split { height: 12px; border-radius: 3px; }
.totals .dep { background: rgba(128, 128, 128, .28); background: color-mix(in srgb, var(--paper) 13%, transparent); border-radius: var(--r2); padding: 12px; display: grid; gap: 2px; font-size: .84rem; }
.totals .dep b { font-weight: var(--fig); font-size: 1.25rem; letter-spacing: -0.01em; }
.totals .dep > span { opacity: .84; line-height: 1.35; }
.bd { display: grid; gap: 3px; align-content: start; }
.lg { background: var(--card); border-radius: 6px; }
.lg-h { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 5px 10px; align-items: center; width: 100%; padding: 11px 10px 11px 13px; border-radius: 6px; }
.lg-n { font-weight: 650; font-size: .95rem; line-height: 1.25; }
.lg-a, .lg-k { font-weight: 650; font-size: .95rem; white-space: nowrap; text-align: right; }
.lg-c { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 3px 14px; align-items: center; font-size: .8rem; color: var(--soft); line-height: 1.35; }
.lg-c .sp { flex: 0 0 100%; max-width: 15rem; color: var(--ink); margin-bottom: 2px; }
.lg .rw-p { padding: 0 8px 10px; }
.lg .it { background: var(--paper); }
.legend { font-size: .82rem; color: var(--soft); line-height: 1.5; padding: 4px 2px 0; }

/* ---------- compared with a factory in China ---------- */
.cn-g { display: grid; gap: 8px; }
@media (min-width: 860px) { .cn-g { grid-template-columns: 1fr 1fr; align-items: start; } }
.cn-g .fg { background: var(--card); border-radius: var(--r); padding: 18px 16px; gap: 12px; }
.cn-g .fg figcaption { padding: 0; }
.vb { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; align-items: end; font-size: .9rem; line-height: 1.3; }
.vn small { display: block; font-size: .78rem; color: var(--soft); }
.vv { font-weight: 650; white-space: nowrap; text-align: right; }
.vt { grid-column: 1 / -1; position: relative; height: 12px; }
.vt i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 4px; }
.vt i:first-child:not(:last-child) { border-radius: 0; }
.vt i.hi { opacity: .42; }
.cn-s { font-weight: 650; font-size: .92rem; line-height: 1.4; }
.cn-n { font-size: .8rem; color: var(--soft); line-height: 1.45; }
.cn-n.k { color: var(--ink); font-size: .88rem; }
/* hourly rates on one scale: a floating bar per row, the bid in its package color */
.rrs { display: grid; gap: 12px; }
.rr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; }
.rn { font-weight: 650; font-size: .9rem; line-height: 1.3; }
.rn small { display: block; font-weight: 400; font-size: .78rem; color: var(--soft); line-height: 1.35; }
.rv { font-weight: 650; font-size: .9rem; white-space: nowrap; text-align: right; }
.rt { grid-column: 1 / -1; position: relative; height: 10px; border-radius: 3px; background: var(--paper); margin-top: 4px; }
.rt i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.rr:not(.me) .rt i { opacity: .5; }
.rg { font-size: .8rem; font-weight: 650; color: var(--soft); border-top: 1px solid var(--well); padding-top: 10px; margin-top: 2px; }
.rax { display: grid; grid-template-columns: 1fr auto 1fr; font-size: .72rem; color: var(--soft); margin-top: -6px; }
.rax span:last-child { text-align: right; }


/* ---------- how the work runs ---------- */
.cards { display: grid; gap: 8px; }
@media (min-width: 860px) { .cards { grid-template-columns: 1fr 1fr; align-items: start; } }
.cd { background: var(--card); border-radius: var(--r); padding: 18px 16px; display: grid; gap: 6px; }
.cd li { position: relative; padding-left: 16px; font-size: .94rem; line-height: 1.45; margin-top: 7px; }
.cd li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 1px; background: var(--ink); }
.cd ol { counter-reset: s; }
.cd ol li { padding-left: 30px; counter-increment: s; }
.cd ol li::before { content: counter(s); width: 20px; height: 20px; top: .12em; border-radius: 5px; background: var(--ink); color: var(--paper); font-size: .7rem; font-weight: 650; display: grid; place-items: center; }
.cd p { font-size: .94rem; line-height: 1.45; }
.cd .lead { font-weight: 650; margin-top: 4px; }
.phases { display: grid; gap: 7px; margin: 10px 0 6px; }
.ph { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: .84rem; line-height: 1.3; }
.ph .pv { font-weight: 650; white-space: nowrap; }
.ph .pt { grid-column: 1 / -1; position: relative; height: 8px; border-radius: 2px; background: var(--paper); overflow: hidden; }
.ph .pt i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); opacity: .38; border-radius: 2px; }
.ph .pt i.lo { opacity: 1; }
.accept { background: var(--card); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.sum { background: var(--paper); border-radius: var(--r2); padding: 14px; font-size: .92rem; line-height: 1.55; overflow-wrap: anywhere; }
.acts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ok { font-size: .88rem; font-weight: 600; }
.thanks { margin-top: 28px; display: grid; gap: 8px; max-width: 34rem; }
.thanks p { font-size: 1.02rem; line-height: 1.5; }
.end { padding-block: 22px 26px; font-size: .82rem; color: var(--soft); }

/* ---------- running total ---------- */
.bar { position: sticky; bottom: 0; z-index: 5; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.bar button { pointer-events: auto; width: 100%; max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; align-items: center; background: var(--ink); color: var(--paper); border-radius: var(--r); padding: 10px 14px; box-shadow: 0 6px 22px rgba(0, 0, 0, .26), 0 0 0 2px var(--paper); }

.bar .pr { font-weight: var(--fig); font-size: 1rem; line-height: 1.15; }
.bar .dp { grid-row: 1 / 3; grid-column: 2; text-align: right; font-size: .76rem; line-height: 1.25; }
.bar .dp b { display: block; font-size: .96rem; }

/* ---------- edit mode (only someone who may edit the page ever sees this) ---------- */
.ed-fab { position: fixed; right: 12px; bottom: 88px; z-index: 30; display: inline-flex; align-items: center; gap: 7px; background: var(--blue); color: var(--on-blue); font-weight: 650; padding: 11px 15px; border-radius: 99px; box-shadow: 0 6px 20px rgba(0, 0, 0, .3), 0 0 0 2px var(--paper); }
.ed-fab svg { width: 16px; height: 16px; }

.ed-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ed-gap { flex: 1; }
.ed-count { font-size: .82rem; flex: 1; min-width: 6.5rem; line-height: 1.25; }
.ed-count b { display: block; font-size: .92rem; }
.ed-seg { display: inline-flex; background: rgba(128, 128, 128, .35); border-radius: 7px; padding: 2px; }
.ed-seg button { padding: 8px 11px; border-radius: 5px; font-weight: 650; font-size: .84rem; }
.ed-seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
.ed-btn { padding: 9px 12px; border-radius: 6px; font-weight: 650; font-size: .84rem; background: rgba(128, 128, 128, .35); line-height: 1.2; }

.ed-btn[disabled] { opacity: .45; cursor: default; }
.ed-hint { font-size: .78rem; opacity: .85; line-height: 1.35; }
body.edit-text [data-t] { background: rgba(36, 71, 232, .16); border-radius: 3px; cursor: text; box-shadow: 0 0 0 2px rgba(36, 71, 232, .16); }
body.edit-text [data-t][data-ch] { background: rgba(242, 182, 50, .45); box-shadow: 0 0 0 2px rgba(242, 182, 50, .45); }
body.edit-text svg [data-t] { text-decoration: underline; cursor: text; }
body.edit-text svg [data-t][data-ch] { fill: var(--risk-mid); }
.empty { font-style: normal; font-weight: 500; opacity: .75; }
.ed-sheet { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .45); display: grid; align-items: start; }
.ed-sheet.full { align-items: stretch; }
.ed-card { background: var(--card); color: var(--ink); border-radius: 0 0 12px 12px; padding: 14px; display: grid; gap: 10px; max-height: 100%; overflow: auto; overscroll-behavior: contain; width: 100%; max-width: 640px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); }
.ed-card.wide { border-radius: 0; max-width: 720px; align-content: start; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.ed-card .ed-btn { background: var(--well); }
.ed-card .ed-btn.go { background: var(--blue); color: var(--on-blue); }
.ed-card textarea, #ed-q { width: 100%; font: inherit; font-size: 1rem; line-height: 1.45; color: var(--ink); background: var(--paper); border: 0; border-radius: var(--r2); padding: 12px; }
.ed-card textarea { resize: vertical; min-height: 4.5em; }
.ed-note { font-size: .82rem; color: var(--soft); line-height: 1.4; }
.ed-note code { font: inherit; font-weight: 650; color: var(--ink); background: var(--well); padding: 1px 5px; border-radius: 4px; }
#ed-list { display: grid; gap: 4px; }
.ng { background: var(--paper); border-radius: var(--r2); }
.ng > summary { padding: 12px; display: flex; align-items: center; gap: 10px; }
.ng > summary b { flex: 1; }
.ed-n { font-size: .8rem; color: var(--soft); }
.ngb { padding: 0 12px 12px; display: grid; gap: 8px; }
.ngb h5 { font-size: .9rem; margin-top: 8px; }
.ix { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; width: 100%; background: var(--card); border-radius: 6px; padding: 10px 11px; font-size: .9rem; line-height: 1.38; }
.ix > span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
.ix.none > span { color: var(--soft); }
.ix > i { font-style: normal; font-size: .7rem; font-weight: 650; background: var(--amber); color: #101010; padding: 3px 6px; border-radius: 4px; }
#ed-list > .ix, #ed-list > .ed-note { background: var(--paper); }
#ed-list > .ed-note { background: none; }
.nf { display: grid; grid-template-columns: 1fr 7.5rem; gap: 10px; align-items: center; font-size: .88rem; line-height: 1.3; }
.nf i { font-style: normal; color: var(--soft); font-size: .76rem; }
.nf input { width: 100%; font: inherit; font-weight: 650; color: var(--ink); background: var(--card); border: 0; border-radius: 6px; padding: 9px 10px; text-align: right; }
.nf.ch input { background: var(--amber); color: #101010; }
.nr { display: grid; gap: 4px; }
.nl { font-size: .88rem; }
.n2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.n2 .nf { grid-template-columns: auto 1fr; }
.n2 .nf > span { color: var(--soft); font-size: .78rem; }

@media (min-width: 720px) {
  .wrap { padding-inline: 28px; }
  .sec { padding-block: 60px; }
  .cover { grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: 44px; align-items: start; padding-block: 34px 18px; }
  .facts { grid-template-columns: repeat(3, auto); justify-content: start; gap: 14px 32px; }
  .target { padding: 22px 20px 16px; }
  .ed-bar { padding: 10px 28px; }
  .ed-count b { display: inline; margin-right: 6px; }
}
@media (min-width: 1040px) { .bar button { margin: 0 0 0 auto; max-width: 380px; } }
@media (prefers-reduced-motion: reduce) { .chev svg { transition: none; } }
@media print { .bar, #edit-ui { display: none; } }

/* ---------- icons: line drawings in the text color, beside each row and each point in What You Get ---------- */
.ri { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.rw-l, .ilab, .lg-n { display: flex; align-items: center; gap: .55em; min-width: 0; }
.rw-l .ri, .ilab .ri, .lg-n .ri { color: var(--soft); }
.rw.off .rw-l .ri { opacity: .6; }
.why-l { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.why-l li::before { content: none; display: none; }
.why-l li { padding-left: 0; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 12px; align-items: start; }
.why-i { width: 38px; height: 38px; border-radius: 50%; background: var(--well); display: grid; place-items: center; color: var(--ink); }
.why-i .ri { width: 20px; height: 20px; }
.why-l li > div { padding-top: 8px; }

/* ---------- accent picker, in edit mode ---------- */
.accs { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; margin-top: 6px; }
.acc { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; padding: 10px 11px; border-radius: var(--r2); background: var(--well); border: 2px solid transparent; font: inherit; font-size: .85rem; font-weight: 600; color: inherit; text-align: left; cursor: pointer; }
.acc[aria-pressed="true"] { border-color: var(--ink); }
.acc-s { display: flex; gap: 3px; }
.acc-s i { display: block; width: 18px; height: 18px; border-radius: 4px; }

/* ---------- the extras at no added cost: the package color, hatched ---------- */
.bar2 i.x { background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, .62) 0 2.5px, transparent 2.5px 6px); }
.lgd .k.x { background-image: repeating-linear-gradient(135deg, var(--card) 0 2px, transparent 2px 5px); }

/* ---------- motion. Charts draw in once, the first time they scroll into view; bars then glide when a choice changes
   them (the script measures and plays that), a price counts to its new figure, and a row's panel slides in as it opens.
   Print, and any device that asks for less motion, gets the finished page with nothing moving. ---------- */
@media screen and (prefers-reduced-motion: no-preference) {
  .drw :is(.bar2, .rt i, .vt i, .pt i, .sp:not(.sw) i, .sg i) { transform-origin: 0 50%; }
  .drw:not(.drw-go) :is(.bar2, .rt i, .vt i, .pt i, .sp:not(.sw) i, .sg i) { transform: scaleX(0); }
  .drw:not(.drw-go) .dots i { transform: scale(0); }
  .drw.drw-go :is(.bar2, .rt i, .vt i, .pt i, .sp:not(.sw) i, .sg i, .dots i) { transition: transform .8s cubic-bezier(.2, .75, .25, 1); }
  .opn { animation: opn .28s cubic-bezier(.2, .75, .25, 1); }
  @keyframes opn { from { opacity: 0; transform: translateY(-6px); } }
  .btn, .cr, .acc, .rw-h, .lg-h { transition: background-color .2s ease, color .2s ease, border-color .2s ease; }
}

function quoteAt(N, at) {

  var walk = function (o) {
    Object.keys(o).forEach(function (k) {
      var v = o[k], x;
      if (Array.isArray(v) && v.length === 2 && typeof v[0] === 'number' && typeof v[1] === 'number') {
        x = v[0] + (v[1] - v[0]) * q;
        x = WHOLE[k] ? Math.round(x) : Math.round(x / 10) * 10;
        o[k] = [x, x];

        (firm && show('cn.p.sum') ? '<p class="cn-s">' + T('cn.p.sum', { a: usd(C.firmLow), b: usd(C.firmHigh), low: usd(cL), high: usd(cH) }) + '</p>' : '') + '</figure>';

        vb(T('vs.me'), wk(C.weeksMine), C.weeksMine, C.weeksMine, topW, mine) + vb(T('cn.them'), wks(C.weeksLow, C.weeksHigh), C.weeksLow, C.weeksHigh, topW, them) +
        (n >= 2 && show('cn.t.sum') ? '<p class="cn-s">' + T('cn.t.sum', { n: n, mine: wk(n * C.weeksMine), them: wks(n * C.weeksLow, n * C.weeksHigh) }) + '</p>' : '') +
        (show('cn.t.note') ? '<p class="cn-n">' + T('cn.t.note') + '</p>' : '') + '</figure>';

  /* ---------- how the work runs ---------- */
  function list(prefix, n, vars, ordered, swap) {

  function renderWork() {

      '<p>' + T(p.build ? 'tl.p.build' : 'tl.p', { hours: B.hours(t.hours), pace: B.num(NUMS.pace) }) + '</p><div class="phases" id="tl-bars">';

    });
    s += '</div><ol>';
    var steps = [['tl.s.kick']];

    else {
      steps.push(['tl.s.shapes'], ['tl.s.eng'], [cfg.fw ? 'tl.s.fab.pcb' : 'tl.s.fab']);

      steps.push(['tl.s.handoff']);
    }
    steps.forEach(function (x) { if (show(x[0])) s += '<li>' + T(x[0], x[1]) + '</li>'; });
    s += '</ol></div>';

    s += '<div class="cd"><h3>' + T('mo.h') + '</h3>' + list('mo.', 8) + '</div>' +
      '<div class="cd"><h3>' + T('nd.h') + '</h3>' + list('nd.', 6) + '</div>' +
      '<div class="cd"><h3>' + T('ni.h') + '</h3>' + list('ni.', 7, null, false, { 1: consult ? 'ni.1.consult' : cfg.pcb && cfg.fw ? '' : cfg.pcb ? 'ni.1.fw' : cfg.fw ? 'ni.1.pcb' : 'ni.1' }) + '</div>' +
      '<div class="cd"><h3>' + T('tm.h') + '</h3>' + list('tm.', 6) + '</div></div>';

  }

  /* ---------- to go ahead ---------- */
  function summaryLines() {
    var r = B.compute(cfg), t = r.totals, p = B.PK[cfg.pkg], def = B.defaults(cfg.pkg), ch = [], consult = cfg.pkg === 'consult';
    if (!consult) {

      if (cfg.rounds !== def.rounds || (cfg.rounds && cfg.proto !== def.proto)) ch.push(cfg.rounds ? plain('sum.ch.proto', { n: cfg.rounds, material: plain('proto.' + cfg.proto) }) : plain('sum.ch.noproto'));
      if (cfg.pcb !== def.pcb) ch.push(plain('sum.ch.pcb.' + cfg.pcb));

      if (cfg.screen) ch.push(plain('sum.ch.screen.' + cfg.screen));

  }

    $('#bar').innerHTML = '<span class="nm">' + pc(cfg.pkg) + (changedFromBase() ? esc(plain(more ? 'bar.added' : 'bar.changed', { package: name })) : esc(name)) + '</span>' +
      '<span class="pr" data-tw="bar">' + B.money(t.total) + '</span><span class="dp">' + esc(plain('bar.deposit')) + '<b data-tw="bar-dep">' + B.usd(t.deposit) + '</b></span>';
    $('#bar').setAttribute('aria-label', name + ', ' + B.money(t.total) + ', deposit ' + B.usd(t.deposit) + '. Go to the price breakdown.');

  /* redraw, and put the keyboard focus back on the control it was on */
  function redraw(fn) {
    var a = document.activeElement, id = a && a.id, snap = snapBars();
    fn();
    afterRender(snap);
    if (id && !(a && a.closest && a.closest('#edit-ui'))) {

      if (el && el !== document.activeElement) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
    }

    });
  }

  /* ---------- using the page ---------- */
  function goTo(id) {
    var el = document.getElementById(id);
    if (!el) return;
    if (el.tagName === 'DETAILS') el.open = true;
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var far = Math.abs(el.getBoundingClientRect().top) > (window.innerHeight || 800) * 2;     // a long glide is disorienting: go straight there
    el.scrollIntoView({ behavior: calm || far ? 'auto' : 'smooth', block: 'start' });
  }
  /* Under 30 g brings the material-matched prototypes and the PCB with it. held is the prototype plan and the PCB choice from before, so that leaving under 30 g undoes all three. */
  var held = null;
  function clamp() { cfg = B.settle(cfg); }
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t.closest) return;
    if (t.closest('#edit-ui')) return;
    if (t.closest('#copy')) { copySummary(); return; }
    var tog = t.closest('[data-row],[data-led]');
    if (tog) {                                  // a row opens and closes where it is
      var kind = tog.hasAttribute('data-row') ? 'row' : 'led', rid = tog.getAttribute('data-' + kind);
      open[kind][rid] = !open[kind][rid];
      motion.opened = open[kind][rid] ? { kind: kind, id: rid } : null;
      redraw(kind === 'row' ? renderPackages : renderPrice);
      return;
    }
    var el = t.closest('[data-pkg],[data-set],[data-step],[data-goto],[data-reset]');
    if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
    var changed = false, go = el.getAttribute('data-goto');
    if (el.hasAttribute('data-pkg')) {
      var k = el.getAttribute('data-pkg');
      if (k !== cfg.pkg) { cfg = B.defaults(k); held = null; changed = true; }
    }
    if (el.hasAttribute('data-reset')) { cfg = B.defaults(cfg.pkg); held = null; changed = true; }
    if (el.hasAttribute('data-set') && cfg.pkg !== 'consult') {
      var ch = JSON.parse(el.getAttribute('data-set'));
      if (ch.weight && ch.weight !== cfg.weight) {
        if (ch.weight === 'W30') held = { proto: cfg.proto, rounds: cfg.rounds, pcb: cfg.pcb };
        else if (cfg.weight === 'W30' && held) { ch.proto = held.proto; ch.rounds = held.rounds; ch.pcb = held.pcb; held = null; }
      }
      for (var key in ch) cfg[key] = ch[key];
      changed = true;
    }
    if (el.hasAttribute('data-step') && cfg.pkg !== 'consult') {
      var parts = el.getAttribute('data-step').split(':');
      cfg[parts[0]] += parseInt(parts[1], 10);
      changed = true;
    }
    if (changed) { clamp(); renderAll(); }
    if (go) goTo(go);
  });
  document.addEventListener('toggle', function (e) {
    var d = e.target;
    if (!d || !d.classList || edit.on) return;
    if (d.classList.contains('tsg')) open.ts[d.getAttribute('data-ts')] = d.open;
    if (d.classList.contains('cmp-more')) open.cmp.more = d.open;
  }, true);
  function copySummary() {
    var txt = summaryText(), note = $('#copied');
    var fail = function () {
      var box = $('#summary'), sel = window.getSelection(), rg = document.createRange();
      rg.selectNodeContents(box); sel.removeAllRanges(); sel.addRange(rg);

  }

  /* =====================================================================
     Edit mode. Offered only to someone who may edit this page.
     Tap any text to change it, or find it under All text. Numbers changes the prices.
     Save publishes the page again with the changes inside it, so everyone who opens it sees them.
     ===================================================================== */
  var AFTER_KEY = 'kyomi-bid-after-save-1';
  var perm = { known: false, can: false };
  var SECTIONS = [
    ['Top of the Page', /^(brand|nav)\b/],
    ['Cover and Letter', /^(cover|letter)\b/],
    ['Target Specification', /^(target|ts|wt)\b/],
    ['Packages and Rows', /^(pk|pkg|stat|row|cell|pill|extras|mx|opt|rw)\b/],
    ['Side by Side Charts', /^cmp\b/],
    ['Options', /^(ad|math|risk|proto|why)\b/],
    ['Price Breakdown and Line Items', /^(pr|tot|line|calc|what|incl|item|mat|cost|kinds)\b/],
    ['How the Price Compares', /^(vs|fr|sp)\b/],
    ['Comparison With a Factory in China', /^cn\b/],
    ['Payment, Timeline and Terms', /^(wk|pay|ms|tl|mo|nd|ni|tm)\b/],
    ['Acceptance, Summary and Footer', /^(ac|sum|thanks|footer|bar)\b/]
  ];
  var PARTS = ['text', 'num'];
  function canon(d) {
    var out = {};
    PARTS.forEach(function (p) {
      var o = (d && d[p]) || {}, c = {};
      Object.keys(o).sort().forEach(function (k) { c[k] = o[k]; });
      out[p] = c;
    });
    return JSON.stringify(out);
  }
  /* what the editor has changed, relative to the saved page */
  function diff() {
    var d = { text: {}, num: {}, drop: { text: [], num: [] } };
    PARTS.forEach(function (p) {
      var k;
      for (k in ov[p]) if (ov[p][k] !== SAVED[p][k]) d[p][k] = ov[p][k];
      for (k in SAVED[p]) if (!(k in ov[p])) d.drop[p].push(k);
    });
    return d;
  }
  function applyDiff(d) {
    PARTS.forEach(function (p) {
      var set = d[p] || {}, k;
      for (k in set) if (p === 'text' ? typeof set[k] === 'string' : (typeof set[k] === 'number' && isFinite(set[k]))) ov[p][k] = set[k];
      ((d.drop && d.drop[p]) || []).forEach(function (key) { delete ov[p][key]; });
    });
  }
  function changes() {
    var d = diff();
    return Object.keys(d.text).length + Object.keys(d.num).length + d.drop.text.length + d.drop.num.length;
  }
  /* Unsaved edits wait on this device as a list of changes, so they can be put back on top of whatever is saved by then. */
  function keepDraft() {
    try {
      if (changes()) localStorage.setItem(DRAFT_KEY, JSON.stringify(diff())); else localStorage.removeItem(DRAFT_KEY);
    } catch (e) { /* storage may be unavailable: the edits then live until the page closes */ }
  }
  function readDraft() {
    try {
      var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
      if (d && typeof d === 'object') return d;
    } catch (e) { /* no draft */ }
    return null;
  }
  function changed(key) { return ov.text[key] !== SAVED.text[key]; }
  function original(key) { return BID_TEXT[key] == null ? '' : String(BID_TEXT[key]); }

  /* ---- the bar across the top while editing ---- */
  function ui() { return document.getElementById('edit-ui'); }
  function barHTML(n) {
    var hint = edit.status || (edit.mode === 'text'
      ? 'Tap any highlighted text to change it. Wording that only appears for certain selections is under All text.'
      : 'The page works normally now, so you can change the selection. Switch back to Tap text to edit.');
    return '<div class="ed-bar"><div class="ed-row"><span class="ed-count"><b>Editing</b> ' +
      (n ? n + (n === 1 ? ' change' : ' changes') + ' not saved' : 'No changes yet') + '</span>' +
      '<button type="button" class="ed-btn" data-ed="discard"' + (n ? '' : ' disabled') + '>' + (edit.armed ? 'Discard all?' : 'Discard') + '</button>' +
      '<button type="button" class="ed-btn go" data-ed="save"' + (n && !edit.busy ? '' : ' disabled') + '>' + (edit.artifact ? 'Save' : 'Copy edits') + '</button>' +
      '<button type="button" class="ed-btn" data-ed="close">Close</button></div>' +
      '<div class="ed-row"><div class="ed-seg" role="group" aria-label="What a tap does">' +
      '<button type="button" data-ed="mode-text" aria-pressed="' + (edit.mode === 'text') + '">Tap text</button>' +
      '<button type="button" data-ed="mode-use" aria-pressed="' + (edit.mode === 'use') + '">Use page</button></div>' +
      '<button type="button" class="ed-btn" data-ed="index">All text</button>' +
      '<button type="button" class="ed-btn" data-ed="nums">Numbers</button></div>' +
      '<p class="ed-hint" role="status">' + esc(hint) + '</p></div>';
  }
  function renderEditUI() {
    var el = ui(), old = el.querySelectorAll('.ed-bar, .ed-fab'), i;
    for (i = 0; i < old.length; i++) old[i].remove();
    document.body.classList.toggle('editing', edit.on);
    document.body.classList.toggle('edit-text', edit.on && edit.mode === 'text');
    if (edit.can && !edit.on) el.insertAdjacentHTML('afterbegin', '<button type="button" class="ed-fab" data-ed="enter">' + PENCIL + '<span>Edit</span></button>');
    if (edit.can && edit.on) el.insertAdjacentHTML('afterbegin', barHTML(changes()));
    var bar = $('.ed-bar', el);
    document.body.style.paddingTop = bar ? bar.offsetHeight + 'px' : '';
  }
  function setStatus(s) { edit.status = s; renderEditUI(); }
  function refresh() { rebuild(); clamp(); renderAll(); renderEditUI(); }
  function enterEdit() {
    var d = readDraft();

    if (d) {
      applyDiff(d);

    }

  }
  function closeEdit() {

      return;
    }
    if (!edit.on || edit.mode !== 'text') return;
    e.preventDefault(); e.stopPropagation();          // while editing text, the page itself does not react
    var cy = t.closest('[data-cycle]');
    if (cy) { cycle(cy.getAttribute('data-cycle')); return; }
    var el = t.closest('[data-t]');
    if (el) openText(el.getAttribute('data-t'), null);
  }, true);
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    if (t.id === 'ed-q') { $('#ed-list').innerHTML = listHTML(t.value); return; }
    var path = t.getAttribute('data-n');
    if (!path) return;
    var v = parseFloat(t.value);
    if (!isFinite(v)) return;
    if (t.min !== '' && v < parseFloat(t.min)) v = parseFloat(t.min);
    if (t.max !== '' && v > parseFloat(t.max)) v = parseFloat(t.max);
    t.closest('.nf').classList.add('ch');
    setNum(path, v);
  });
  document.addEventListener('toggle', function (e) {
    var d = e.target;
    if (!d || !d.classList || !d.classList.contains('ng')) return;
    if (d.hasAttribute('data-ng')) open.nums[d.getAttribute('data-ng')] = d.open;
    if (d.hasAttribute('data-ix')) open.ix[d.getAttribute('data-ix')] = d.open;
  }, true);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || !edit.on) return;
    var back = edit.back, text = document.getElementById('ed-sheet');
    if (!SHEETS.some(function (id) { return document.getElementById(id); })) return;
    closeSheets();
    if (text && back) openIndex(back);
  });
  /* If the page cannot tell whether this viewer may edit, five quick taps on the last line open editing on this device only. */
  var taps = [];
  document.addEventListener('click', function (e) {
    if (edit.can || (perm.known && !perm.can) || !e.target.closest || !e.target.closest('#s-foot')) return;
    var now = Date.now();
    taps = taps.filter(function (x) { return now - x < 3000; });
    taps.push(now);
    if (taps.length >= 5) { taps = []; edit.can = true; enterEdit(); }
  });

  /* ---------- start ---------- */
  function mount() {
    document.getElementById('app').innerHTML =
      '<header class="top wrap" id="s-top"></header><main>' +
      '<section class="wrap" id="cover"></section><section class="wrap sec" id="packages"></section>' +
      '<section class="wrap sec" id="price"></section><section class="wrap sec" id="china"></section>' +
      '<section class="wrap sec" id="work"></section><section class="wrap sec" id="accept"></section>' +
      '<footer class="wrap end" id="s-foot"></footer></main>' +
      '<div class="bar"><button type="button" id="bar" data-goto="price"></button></div>';
    var e = document.createElement('div');
    e.id = 'edit-ui';
    document.body.appendChild(e);
  }
  function start() {
    /* A save reloads the page. Whoever pressed Save comes back to the same spot, still editing, and is told how it went. */
    var after = null;
    try { after = JSON.parse(sessionStorage.getItem(AFTER_KEY) || 'null'); sessionStorage.removeItem(AFTER_KEY); } catch (e) { after = null; }
    if (!after || !(Date.now() - after.t < 120000)) after = null;
    if (after) {
      var landed = after.want === canon(SAVED), draft = landed ? null : readDraft();
      if (landed) { try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* nothing to clear */ } }
      if (draft) { applyDiff(draft); rebuild(); }
      if (after.cfg && B.PK[after.cfg.pkg]) {
        var d = B.defaults(after.cfg.pkg), k;
        for (k in d) if (after.cfg[k] !== undefined && typeof after.cfg[k] === typeof d[k]) d[k] = after.cfg[k];
        cfg = d;
      }
      clamp();
      edit.can = true; edit.on = true; edit.mode = after.mode === 'use' ? 'use' : 'text';
      edit.status = landed ? 'Saved. Everyone who opens the page now sees this version.'
        : 'The page changed somewhere else, so that save did not go through. Your edits are back on top of the current page: press Save again.';
    }
    if (motion.ok && 'IntersectionObserver' in window) {
      motion.io = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { motion.io.unobserve(e.target); if (e.target.isConnected) revealBox(e.target); } });
      }, { threshold: 0.2 });
    }
    mount(); renderAll(); renderEditUI();
    if (mqWide) {                               // packages are a list on a phone and columns on a wide screen
      var relay = function () { redraw(renderPackages); };
      if (mqWide.addEventListener) mqWide.addEventListener('change', relay); else if (mqWide.addListener) mqWide.addListener(relay);
    }
    if (after) {
      var y = after.y || 0, put = function () { window.scrollTo(0, y); };
      try { history.scrollRestoration = 'manual'; } catch (e) { /* the browser may place the page itself */ }
      put(); setTimeout(put, 60); window.addEventListener('load', put);
    }
    /* Ask, without holding the page up, whether this viewer may edit. */
    var c = window.claude, askFor = function (name) {
      return Promise.resolve().then(function () { return c.use(name); }).then(function (x) { return x || null; }, function () { return null; });
    };
    if (!c || typeof c.use !== 'function') return;
    askFor('artifact').then(function (a) {
      edit.artifact = a && typeof a.publish === 'function' ? a : null;
      if (edit.can) renderEditUI();
    });
    askFor('user').then(function (u) {
      return u && typeof u.canEdit === 'function' ? u.canEdit() : null;
    }).then(function (can) {
      perm.known = can === true || can === false;
      perm.can = can === true;
      if (can === true && !edit.can) { edit.can = true; renderEditUI(); }
    }, function () { /* no answer: the page stays read-only */ });
  }
  start();
})();

</script>
</body>
</html>
